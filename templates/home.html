<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>
</head>
<body>

<h2>AI Resume Analyzer</h2>

<form method="POST"
      action="{% url 'analyze_resume' %}"
      enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <label><b>Job Description</b></label><br>

    <textarea
        name="job_description"
        rows="10"
        cols="80"
        placeholder="Paste Job Description Here"></textarea>

    <br><br>

    <button type="submit">
        Analyze Resume
    </button>

</form>

</body>
</html>
